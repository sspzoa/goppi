name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: release prepare
        env:
          GOPPI_DATA_DIR: ${{ runner.temp }}/goppi-smoke
          GOPPI_INIT_DIR: ${{ runner.temp }}/goppi-init
          UPSTAGE_API_KEY: ci-smoke
          MOCK_SOLAR_PORT: "19876"
        run: make release-prepare
