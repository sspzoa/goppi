name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: version matches tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          got=$(sed -n 's/^var Version = "\(.*\)"/\1/p' internal/config/config.go)
          test "$want" = "$got"
      - name: release prepare
        env:
          GOPPI_DATA_DIR: ${{ runner.temp }}/goppi-release-smoke
          GOPPI_INIT_DIR: ${{ runner.temp }}/goppi-release-init
          UPSTAGE_API_KEY: release-smoke
          MOCK_SOLAR_PORT: "19876"
        run: make release-prepare
      - uses: sigstore/cosign-installer@v4.1.2
      - name: sign checksums
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: verify signature
        run: |
          cosign verify-blob --yes \
            --bundle dist/SHA256SUMS.sigstore.json \
            --certificate-identity-regexp 'https://github.com/sspzoa/goppi/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS.sigstore.json
